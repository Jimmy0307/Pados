# PADOS security scanning: CodeQL, dependency review, repository secret scan, CI policy.
# Findings are evidence for human review; they never change PADOS state or authorize anything.
# GitHub secret scanning and push protection are repository settings (see
# docs/supply_chain/SECURE_CICD_V1.md); this workflow adds the repository-owned scanner.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
permissions: {}
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        id: review
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      # The action cannot run when the repository's Dependency graph is disabled. That is a repository
      # setting, not a dependency finding: it is reported as DEPENDENCY_REVIEW=ENVIRONMENT_BLOCKER (annotation
      # and job summary on every run) instead of a permanently red check. Any other failure fails the job.
      - name: Classify dependency review outcome
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            echo "DEPENDENCY_REVIEW=PASS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The SBOM endpoint answers 200 whenever the Dependency graph is enabled; 404 means it is disabled.
          status=$(curl -sS -m 30 -o review-probe.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPOSITORY/dependency-graph/sbom" || echo 000)
          if [ "$status" = "404" ]; then
            echo "::warning title=DEPENDENCY_REVIEW=ENVIRONMENT_BLOCKER::Dependency graph is disabled for this repository; dependency review did not run. Enable it in Settings > Code security."
            echo "DEPENDENCY_REVIEW=ENVIRONMENT_BLOCKER (Dependency graph disabled; review did not run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "DEPENDENCY_REVIEW=FAIL (probe HTTP $status)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
  secret-scan:
    name: secret scan and CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: python -m pip install -c requirements.lock -e .
      - name: Repository secret scan (values are never printed)
        run: python scripts/release/secret_scan.py secret-scan.json
      - name: CI authority boundary policy
        run: python scripts/release/ci_policy_check.py ci-policy.json
