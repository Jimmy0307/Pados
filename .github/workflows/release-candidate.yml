# PADOS release candidate. This workflow NEVER deploys.
# Job 1 (build-release-candidate, contents: read only, no OIDC): locked build tooling, sdist/wheel
# built with --no-isolation in the locked environment, web bundle, the build environment's actual
# pip freeze inventory, SBOM, unsigned local provenance and the release manifest, uploaded as a
# workflow artifact.
# Job 2 (attest-release-candidate): the only job in the repository granted the id-token and
# attestations write scopes. It only downloads, hashes and attests the uploaded files (Sigstore
# keyless via OIDC; no long-lived credentials) and uploads the attestation bundle separately.
# The Home Base pulls, stages and verifies the candidate (pados.release.deploy_verify); deployment
# additionally requires a signed, single-use human approval bound to the manifest hash and staged
# digest. CI-originated approval is rejected (CI_CANNOT_AUTHORIZE_DEPLOYMENT).
name: release-candidate
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-release-candidate:
    name: build release candidate (no OIDC, no attestation)
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_DIR: release-out
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Reproducible timestamps from the commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies and exactly pinned build tooling
        run: python -m pip install -c requirements.lock -r scripts/release/build-requirements.lock -e ".[dev]"
      - name: Pre-build gates
        run: |
          python scripts/release/ci_policy_check.py ci-policy.json
          python scripts/release/secret_scan.py secret-scan.json
          python -m pytest -q tests/release_supply_chain tests/lifecycle
      - name: Record the build environment inventory (pip freeze)
        run: |
          mkdir -p "$RELEASE_DIR"
          python -m pip freeze --all --exclude-editable > "$RELEASE_DIR/build-environment.txt"
      - name: Build sdist and wheel in the locked environment
        run: python -m build --no-isolation --sdist --wheel --outdir "$RELEASE_DIR"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Build web bundle
        working-directory: web
        run: npm ci --ignore-scripts && npm run build
      - name: Package web bundle (deterministic tar)
        run: python scripts/release/bundle_web.py web/dist "$RELEASE_DIR"
      - name: SBOM (CycloneDX 1.5 and SPDX 2.3) bound to the build environment
        run: python scripts/release/sbom.py "$RELEASE_DIR" --build-environment "$RELEASE_DIR/build-environment.txt"
      - name: Release manifest and unsigned local provenance statement
        run: python scripts/release/release_manifest.py "$RELEASE_DIR"
      - name: Upload release candidate (workflow artifact only)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pados-release-candidate
          path: release-out/
          if-no-files-found: error
          retention-days: 14
  attest-release-candidate:
    name: attest release candidate (download, hash and attest only)
    needs: build-release-candidate
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pados-release-candidate
          path: release-out
      - name: Hash downloaded files
        run: sha256sum release-out/*
      - name: Attest build provenance (Sigstore, OIDC)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-out/*.whl
            release-out/*.tar.gz
            release-out/sbom.cdx.json
            release-out/sbom.spdx.json
            release-out/build-environment.txt
            release-out/release-manifest.json
      - name: Upload attestation bundle (separate artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pados-release-attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
