services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pados-postgres
    environment:
      POSTGRES_DB: pados
      POSTGRES_USER: pados
      POSTGRES_PASSWORD: pados_local_password
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pados -d pados"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pados_postgres_data:/var/lib/postgresql/data

volumes:
  pados_postgres_data:

